                    format: int32
                  char:
                    type: string
                  int:
                    type: integer
                    format: int32
                  long:
                    type: integer
                    format: int64
                  float:
                    type: number
                    format: float
                  double:
                    type: number
                    format: double
                  direct:
                    type: boolean
                  readOnly:
                    type: boolean
        '202':
          description: Result is pending. Client should poll using the requestId.
          headers:
