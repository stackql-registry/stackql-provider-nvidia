  /v2/nvcf/assets:
    get:
      tags:
        - Asset Management
      summary: List Assets
      description: >-
        List assets owned by the current NVIDIA Cloud Account. Requires a 
        bearer token with 'invoke_function' scope in the HTTP Authorization
        header. 
      operationId: getAssets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
      deprecated: true
    post:
      tags:
        - Asset Management
      summary: Create Asset
      description: >-
        Creates a unique id representing an asset and a pre-signed URL to upload
        the  asset artifact to AWS S3 bucket for the NVIDIA Cloud Account.
        Requires a  bearer token  with 'invoke_function' scope in the HTTP
        Authorization header. 
      operationId: createAsset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssetResponse'
      deprecated: true
  /v2/nvcf/pexec/status/{requestId}:
    get:
      tags:
        - Function Invocation
      summary: Poll For Result Using Function Invocation Request
      description: >-
        Deprecated and will be removed soon. Please use the new NVCF Invocation
        API  endpoint to invoke a function and stream results without polling. 
        Retrieves the status of an in-progress or pending request using its
        unique  invocation request ID. If the result is available, it will be
        included in  the response, marking the request as fulfilled. Conversely,
        if the result is  not yet available, the request is deemed pending.
        Access to this endpoint  mandates inclusion of a bearer token with
        'invoke_function' scope in the  HTTP Authorization header. In-progress
        responses are returned in order. If no in-progress response is received 
        during polling you will receive the most recent in-progress response.
        Only the first  256 unread in-progress messages are kept. 
      operationId: getFunctionInvocationResult
      parameters:
        - name: requestId
          in: path
          description: Invocation Request Id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: Invocation is fulfilled
          headers:
