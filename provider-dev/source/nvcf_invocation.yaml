openapi: 3.1.0
info:
  title: nvcf_invocation API
  description: nvidia nvcf_invocation API
  version: 2.245.1
paths:
  /v2/nvcf/tokens/functions:
    post:
      tags:
        - Function Invocation Assertion Token
      summary: Issue Function Invocation Token
      description: >-
        Issues an assertion token from Notary Service for specified functionIds
        and/or functionVersionIds 
      operationId: issueMultiFunctionsInvocationToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiFunctionsInvocationTokenRequest'
        required: true
      responses:
        '200':
          description: Invocation assertion token is issued
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InvocationTokenResponse'
        '403':
          description: >
            Either missing scope in the auth(JWT / ApiKey) token and/or missing
            resource entry
             in the ApiKey for the function.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InvocationTokenResponse'
        '429':
          description: >-
            Client is doing too many requests per second and should slow down
            request rate.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InvocationTokenResponse'
  /v2/nvcf/tokens/functions/{functionId}/versions/{functionVersionId}:
    post:
