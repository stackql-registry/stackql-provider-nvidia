  /v2/nvcf/pexec/functions/{functionId}:
    post:
      tags:
        - Function Invocation
      summary: Call Function
      description: >-
        Deprecated and will be removed soon. Please use the new NVCF Invocation
        API  endpoint to invoke a function.  Invokes the specified function that
        was successfully deployed. If the version  is not specified, any active
        function versions will handle the request. If  the version is specified
        in the URI, then the request is exclusively processed  by the designated
        version of the function. By default, this endpoint will block  for 5
        seconds. If the request is not fulfilled before the timeout, it's
        status  is considered in-progress or pending and the response includes
        HTTP status code  202 with an invocation request ID, indicating that the
        client should commence  polling for the result using the invocation
        request ID. Access to this endpoint  mandates inclusion of a bearer
        token with 'invoke_function' scope in the  HTTP Authorization header.
        Additionally, this endpoint has the capability to  provide updates on
        the progress of the request, contingent upon the workload's  provision
        of such information. In-progress responses are returned in order. If no
        in-progress response is received  during polling you will receive the
        most recent in-progress response. Only the first  256 unread in-progress
        messages are kept. 
      operationId: invokeFunction
      parameters:
        - name: NVCF-INPUT-ASSET-REFERENCES
          in: header
          required: false
          schema:
            type: array
            items:
              type: string
              format: UTF-8
              maxLength: 262144
              minLength: 0
            maxItems: 2147483647
            minItems: 0
        - name: NVCF-POLL-SECONDS
          in: header
          required: false
          schema:
            type: integer
            format: int32
            maximum: 300
            minimum: 0
        - name: functionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '200':
          description: Invocation is fulfilled
          headers:
            NVCF-REQID:
              description: Invocation Request Id
              style: simple
              schema:
                type: string
            NVCF-PERCENT-COMPLETE:
              description: Percentage complete
              style: simple
              schema:
                type: string
            NVCF-STATUS:
              description: Invocation status
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: object
                properties:
                  short:
                    type: integer
                    format: int32
                  char:
                    type: string
                  int:
                    type: integer
                    format: int32
                  long:
                    type: integer
                    format: int64
                  float:
                    type: number
                    format: float
                  double:
                    type: number
                    format: double
                  direct:
                    type: boolean
                  readOnly:
                    type: boolean
        '202':
          description: Result is pending. Client should poll using the requestId.
          headers:
            NVCF-REQID:
              description: Invocation Request Id
              style: simple
              schema:
                type: string
            NVCF-PERCENT-COMPLETE:
              description: Percentage complete
              style: simple
              schema:
                type: string
            NVCF-STATUS:
              description: Invocation status
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: object
                properties:
                  short:
                    type: integer
                    format: int32
                  char:
                    type: string
                  int:
                    type: integer
                    format: int32
                  long:
                    type: integer
                    format: int64
                  float:
                    type: number
                    format: float
                  double:
                    type: number
                    format: double
                  direct:
                    type: boolean
                  readOnly:
                    type: boolean
        '302':
          description: >
            Client should use the URL specified in the 'Location' response
            header to fetch
             large result.
          headers:
            NVCF-REQID:
              description: Invocation Request Id
              style: simple
              schema:
                type: string
            NVCF-PERCENT-COMPLETE:
              description: Percentage complete
              style: simple
              schema:
                type: string
            NVCF-STATUS:
              description: Invocation status
              style: simple
              schema:
                type: string
            Location:
              description: URL to get the result
              style: simple
              schema:
                type: string
        '402':
          description: >-
            Cloud credits expired for public functions. Please contact NVIDIA
            representatives.
          content:
            '*/*':
              schema:
                type: object
                properties:
                  short:
                    type: integer
                    format: int32
                  char:
                    type: string
                  int:
                    type: integer
                    format: int32
                  long:
                    type: integer
                    format: int64
                  float:
                    type: number
                    format: float
                  double:
                    type: number
                    format: double
                  direct:
                    type: boolean
                  readOnly:
                    type: boolean
        '403':
          description: >
            Either missing scope in the auth(JWT / ApiKey) token and/or missing
            resource entry
             in the ApiKey for the function.
          content:
            '*/*':
              schema:
                type: object
                properties:
                  short:
                    type: integer
                    format: int32
                  char:
                    type: string
                  int:
                    type: integer
                    format: int32
                  long:
                    type: integer
                    format: int64
                  float:
                    type: number
                    format: float
                  double:
                    type: number
                    format: double
                  direct:
                    type: boolean
                  readOnly:
                    type: boolean
        '429':
          description: >-
            Client is doing too many requests per second and should slow down
            request rate.
          content:
            '*/*':
              schema:
                type: object
                properties:
                  short:
                    type: integer
                    format: int32
                  char:
                    type: string
                  int:
                    type: integer
                    format: int32
                  long:
                    type: integer
                    format: int64
                  float:
                    type: number
                    format: float
                  double:
                    type: number
                    format: double
                  direct:
                    type: boolean
                  readOnly:
                    type: boolean
      deprecated: true
