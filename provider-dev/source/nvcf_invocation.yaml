  /v2/nvcf/assets/{assetId}:
    get:
      tags:
        - Asset Management
      summary: Show Asset Details
      description: >-
        Returns details for the specified asset-id belonging to the current
        NVIDIA  Cloud Account. Requires a bearer token with 'invoke_function'
        scope in  the HTTP Authorization header. 
      operationId: getAsset
      parameters:
        - name: assetId
          in: path
          description: Asset id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
      deprecated: true
    delete:
      tags:
        - Asset Management
      summary: Delete Asset
      description: >-
        Deletes asset belonging to the current NVIDIA Cloud Account. Requires  a
        bearer token with 'invoke_function' scope in the HTTP Authorization
        header. 
      operationId: deleteAsset
      parameters:
        - name: assetId
          in: path
          description: Id of the asset to be deleted
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '204':
          description: No Content
      deprecated: true
components:
  schemas:
    MultiFunctionsInvocationTokenRequest:
      type: object
      description: Request body for issuing a function invocation token
      properties:
        functions:
          type: array
          description: Functions to invoke
          items:
            $ref: '#/components/schemas/BasicFunctionDto'
          maxItems: 4
          minItems: 0
        clientId:
          type: string
          format: UTF-8
          description: >-
            ClientId for client to pass in to track who will eventually use the
            token
          maxLength: 262144
          minLength: 1
      required:
        - clientId
        - functions
    InvocationTokenResponse:
      type: object
      description: Function invocation token response
      properties:
        access_token:
          type: string
          format: UTF-8
          description: Token issued by Notary Service
          maxLength: 262144
          minLength: 0
        expires_in:
          type: integer
          format: int32
          description: Token expiration time in seconds
          maximum: 2147483647
          minimum: -2147483648
    InvocationTokenRequest:
      type: object
      description: Request body for issuing a function invocation token
      properties:
        clientId:
          type: string
          format: UTF-8
          description: >-
            ClientId for client to pass in to track who will eventually use the
            token
          maxLength: 262144
          minLength: 1
      required:
        - clientId
    ListAssetsResponse:
      type: object
      description: Response body containing list of assets of the current nca id
      properties:
        assets:
          type: array
          description: List of assets uploaded for the nca id
          items:
            $ref: '#/components/schemas/AssetDto'
          maxItems: 2147483647
          minItems: 0
    CreateAssetRequest:
      type: object
      description: >-
        Request payload to create an asset-id and the corresponding pre-signed
        URL to upload an asset of specified content-type to AWS S3 bucket.
      properties:
        contentType:
          type: string
          format: UTF-8
          description: Content type of the asset such image/png, image/jpeg, etc.
          maxLength: 262144
          minLength: 0
        description:
          type: string
          format: UTF-8
          description: Asset description
          maxLength: 262144
          minLength: 0
      required:
        - contentType
        - description
    CreateAssetResponse:
      type: object
      description: >-
        Response body containing asset-id and the corresponding pre-signed URL
        to upload an asset of specified content-type to AWS S3 bucket.
      properties:
        assetId:
          type: string
          format: uuid
          description: Unique id of the asset to be uploaded to AWS S3 bucket
          maxLength: 36
          minLength: 36
        uploadUrl:
