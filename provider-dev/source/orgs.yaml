  /v2/org/{org_name}/users:
    get:
      tags:
        - Users Management
      summary: List users In org
      description: >-
        Get list of users in organization. (User Admin in org privileges
        required)
      operationId: listUsersInOrg
      parameters:
        - name: org_name
          in: path
          required: true
          schema:
            type: string
        - name: exclude-from-team
          in: query
          description: Name of team to exclude members from
          required: false
          schema:
            type: string
        - name: page-number
          in: query
          description: The page number of result
          required: false
          schema:
            type: integer
            format: int32
        - name: page-size
          in: query
          description: The page size of result
          required: false
          schema:
            type: integer
            format: int32
        - name: q
          in: query
          description: >-
            User Search Parameters. Only 'filters' and 'orderBy' for 'name' and
            'email' are implemented
          required: false
          schema:
            $ref: '#/components/schemas/SearchParams'
      responses:
        '200':
