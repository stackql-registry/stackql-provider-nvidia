components:
  schemas:
    UserNcaInvitationRequest:
      type: object
      properties:
        message:
          type: string
          description: Is a message to the new user
        inviteAs:
          type: string
          description: Nca allow users to be invited as Admin and as Member
          enum:
            - ADMIN
            - MEMBER
        email:
          maxLength: 128
          minLength: 7
          type: string
          description: Is the user email
        invitationExpirationIn:
          type: integer
          description: Is the numbers of days the invitation will expire
          format: int32
      description: NCA User invitation request
    UserResponse:
      type: object
      properties:
        activationToken:
          type: string
          description: token needed to activate the user to enable login and other features
        userRoles:
          type: array
          description: DEPRECATED - Please use roles inside user
          items:
            $ref: '#/components/schemas/UserRole'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        ncaRole:
          type: string
          description: NCA role
          enum:
            - UNKNOWN
            - ADMINISTRATOR
            - MEMBER
            - OWNER
            - PENDING
        user:
          $ref: '#/components/schemas/User'
      description: ' about one user'
    ErrorResponse:
      type: object
      properties:
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
    OrgCreateRequestV3:
      type: object
      properties:
        salesforceAccountIndustry:
          type: string
          description: Company or organization industry
        pecName:
          type: string
          description: product end customer name for enterprise(Fleet Command) product
        orgOwner:
          $ref: '#/components/schemas/OrgOwnerV3'
        displayName:
          maxLength: 255
          minLength: 1
          type: string
          description: Name of the organization that will be shown to users.
        name:
          maxLength: 64
          minLength: 2
          type: string
          description: Organization name
        sendEmail:
          type: boolean
          description: Send email to org owner or not. Default is true
        country:
          type: string
          description: user country
        description:
          maxLength: 128
          type: string
          description: optional description of the organization
        initiator:
          type: string
          description: Identify the initiator of the org request
        productEnablements:
          type: array
          items:
            $ref: '#/components/schemas/ProductEnablement'
        ncaNumber:
          type: string
          description: NVIDIA Cloud Account Number
        pecSfdcId:
          type: string
          description: >-
            product end customer salesforce.com Id (external customer Id) for
            enterprise(Fleet Command) product
        ncaId:
          type: string
          description: NVIDIA Cloud Account Identifier
        isInternal:
          type: boolean
          description: Is NVIDIA internal org or not
        protoOrgId:
          type: string
          description: Proto org identifier
        type:
          type: string
          enum:
            - UNKNOWN
            - CLOUD
            - ENTERPRISE
            - INDIVIDUAL
        productSubscriptions:
          type: array
          description: This should be deprecated, use productEnablements instead
          items:
            $ref: '#/components/schemas/ProductSubscription'
      description: Request to create new Organization in v3 flow
    OrgResponse:
      type: object
      properties:
        organizations:
          $ref: '#/components/schemas/Organization'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      description: info about an organizations
    UserKeyResponse:
      required:
        - key
      type: object
      properties:
        cloudNfsKey:
          type: string
        cloudNfsKeyPwd:
          type: string
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        key:
          maxLength: 255
          type: string
        cloudNfsUserName:
          type: string
      description: response to a request to access key such as docker token
    SearchParams:
      type: object
      properties:
        orderBy:
          type: array
          items:
            $ref: '#/components/schemas/SearchParamOrderBy'
        queryFields:
          type: array
          items:
            type: string
        scoredSize:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        fields:
          type: array
          items:
            type: string
        page:
          type: integer
          format: int64
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchParamFilter'
        query:
          type: string
        groupBy:
          type: string
    UserListResponse:
