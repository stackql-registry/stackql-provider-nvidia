        Disassociate encryption key from model in org and mark it for offline
        deletion
      operationId: disassociateKeyFromModelInOrg
      parameters:
        - name: org_name
          in: path
          description: Organization name
          required: true
          schema:
            type: string
            format: UTF-8
            maxLength: 255
            minLength: 0
        - name: model_name
          in: path
          description: Model name
          required: true
          schema:
            type: string
            format: UTF-8
            maxLength: 255
            minLength: 0
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatusUrlResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
      security:
        - ssa:
            - kas
      x-ssa-scopes:
        - kas
