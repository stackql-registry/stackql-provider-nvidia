openapi: 3.1.0
info:
  title: nvcf_deployments API
  description: nvidia nvcf_deployments API
  version: 2.245.1
paths:
  /v2/nvcf/secrets/telemetries/{telemetryId}:
    put:
      tags:
        - User Secret Management
      summary: Update secret for a specific Telemetry Id
      description: >-
        Updates secret for the specific telemetry Id within NVIDIA Cloud
        Account. This endpoint requires a bearer token with 'update_secrets'
        scope in the HTTP Authorization header. 
      operationId: updateTelemetrySecret
      parameters:
        - name: telemetryId
          in: path
          description: NVIDIA Cloud Account Id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTelemetrySecretRequest'
        required: true
      responses:
        '204':
          description: No Content
  /v2/nvcf/deployments/functions/{functionId}/versions/{functionVersionId}:
    get:
      tags:
        - Function Deployment
      summary: Get Function Deployment Details
      description: >-
        Allows Account Admins to retrieve the deployment details of the
        specified  function version. Access to this endpoint mandates a bearer
        token with 'deploy_function' scope in the  HTTP Authorization header. 
      operationId: getFunctionDeployment
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
    put:
      tags:
        - Function Deployment
      summary: Update Function Deployment
      description: ' Deprecated and will be removed soon. Use a single GPU specification update  method instead.  Updates the deployment specs of the specified function version. It''s important  to note that GPU type and backend configurations cannot be modified through  this endpoint. If the specified function is public, then Account Admin cannot  perform this operation. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: updateFunctionDeployment
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionDeploymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
      deprecated: true
    post:
      tags:
        - Function Deployment
      summary: Deploy Function
      description: >-
        Initiates deployment for the specified function version. Upon invocation
        of  this endpoint, the function's status transitions to 'DEPLOYING'. If
        the  specified function version is public, then Account Admin cannot
        perform this  operation. Access to this endpoint mandates a bearer token
        with 'deploy_function' scope in the  HTTP Authorization header. 
      operationId: createFunctionDeployment
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionDeploymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
    delete:
      tags:
        - Function Deployment
      summary: Delete Function Deployment
      description: >-
        Deletes the deployment associated with the specified function. Upon 
        deletion, any active instances will be terminated, and the function's
        status  will transition to 'INACTIVE'. To undeploy a function version
        gracefully,  specify 'graceful=true' query parameter, allowing current
        tasks to complete  before terminating the instances. If the specified
        function version is public,  then Account Admin cannot perform this
        operation. Access to this endpoint mandates a bearer token with
        'deploy_function' scope in the  HTTP Authorization header. 
      operationId: deleteFunctionDeployment
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: graceful
          in: query
          description: Query param to deactivate function for graceful shutdown
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
  /v2/nvcf/telemetries:
    get:
      tags:
        - Telemetry Management
      summary: List Telemetries
      description: >-
        Retrieves telemetry configurations for a specific NVIDIA Cloud Account. 
        requires a bearer token with 'manage_telemetries' scope in the HTTP 
        Authorization header. 
      operationId: getTelemetriesByAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTelemetryResponse'
    post:
      tags:
        - Telemetry Management
      summary: Create Telemetry
      description: >-
        Creates telemetry endpoints for NVIDIA Cloud Accounts.  requires a
        bearer token with 'manage_telemetries' scope in the HTTP  Authorization
        header. 
      operationId: createTelemetry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
  /v2/nvcf/registry-credentials:
    get:
      tags:
        - Registry Credential Management
      summary: List Registry Credentials
      description: >-
        Lists all the registry credentials associated with the authenticated 
        NVIDIA Cloud Account. Requires a bearer token in the HTTP Authorization
        header with 'manage_registries' scope. 
      operationId: listRegistryCredentialDetails
      parameters:
        - name: artifactType
          in: query
          description: >
            Filters registry credentials using the specified 'artifactType'
            query param.
          required: false
          schema:
            type: array
            default:
              - CONTAINER
              - HELM
              - MODEL
              - RESOURCE
            items:
              type: string
              format: UTF-8
              enum:
                - CONTAINER
                - HELM
                - MODEL
                - RESOURCE
              maxLength: 262144
              minLength: 0
            maxItems: 2147483647
            minItems: 0
            uniqueItems: true
        - name: provisionedBy
          in: query
          description: >
            Filters registry credentials using the specified 'provisionedBy'
            query param.
          required: false
          schema:
            type: array
            default:
              - SYSTEM
              - USER
            items:
              type: string
              format: UTF-8
              enum:
                - SYSTEM
                - USER
              maxLength: 262144
              minLength: 0
            maxItems: 2147483647
            minItems: 0
            uniqueItems: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRegistryCredentialDetailsResponse'
    post:
      tags:
        - Registry Credential Management
      summary: Add new registry credential to the account
      description: >-
        Adds a new registry credential to the account. Requires a bearer token
        in the HTTP Authorization header with 'manage_registries' scope. 
      operationId: addRegistryCredential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRegistryCredentialRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDetailsResponse'
  /v2/nvcf/registry-credentials/{registryCredentialId}:
    get:
      tags:
        - Registry Credential Management
      summary: Get Registry Credential Details
      description: >-
        Retrieves detailed information of the specified registry credential 
        associated with the authenticated NVIDIA Cloud Account. Requires a
        bearer token in the HTTP Authorization header with 'manage_registries'
        scope. 
      operationId: getRegistryCredentialDetails
      parameters:
        - name: registryCredentialId
          in: path
          description: Registry Credential id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDetailsResponse'
    delete:
      tags:
        - Registry Credential Management
      summary: Delete Registry Credential
      description: >-
        Deletes the specified registry credential associated with the
        authenticated  NVIDIA Cloud Account. Requires a bearer token in the HTTP
        Authorization header with 'manage_registries' scope. 
      operationId: deleteRegistryCredential
      parameters:
        - name: registryCredentialId
          in: path
          description: Registry Credential id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '204':
          description: No Content
    patch:
      tags:
        - Registry Credential Management
      summary: Update registry credential
      description: >-
        Updates the secret and/or the artifact types associated with the
        specified  registry credential. Artifact types specified in the request
        body are  added to the set of artifact types that already exist for the
        specified  registry credential. Requires a bearer token in the HTTP
        Authorization header with 'manage_registries' scope. 
      operationId: updateRegistryCredential
      parameters:
        - name: registryCredentialId
          in: path
          description: Registry Credential id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegistryCredentialRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDetailsResponse'
  /v2/nvcf/deployments/{deploymentId}/gpu-specifications/{gpuSpecId}:
    patch:
      tags:
        - Function Deployment
      summary: Update the specified GPU specification under the specified deployment
      description: ' Updates the GPU specification of the specified function version''s deployment.  It''s important to note that GPU type and backend configurations cannot be  modified through this endpoint. If the specified function is public,  then Account Admin cannot perform this operation. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: updateGpuSpecification
      parameters:
        - name: deploymentId
          in: path
          description: Deployment id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: gpuSpecId
          in: path
          description: GPU Specification id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGpuSpecificationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGpuSpecificationResponse'
  /v2/nvcf/telemetries/{telemetryId}:
    get:
      tags:
        - Telemetry Management
      summary: Get Telemetry Details
      description: >-
        Retrieves the details of a specific telemetry configuration by its ID. 
        requires a bearer token with 'manage_telemetries' scope in the HTTP 
        Authorization header. 
      operationId: getTelemetry
      parameters:
        - name: telemetryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
    delete:
      tags:
        - Telemetry Management
      summary: Delete Telemetry
      description: >-
        Deletes a specific telemetry configuration for a NVIDIA Cloud Account. 
        requires a bearer token with 'manage_telemetries' scope in the HTTP 
        Authorization header. If there any functions that are dependent on the 
        Telemetry that is being deleted, then response with 400 status code
        will  be returned. 
      operationId: deleteTelemetry
      parameters:
        - name: telemetryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '204':
          description: No Content
        '400':
          description: Cannot be deleted till Functions depend on it
  /v2/nvcf/recognized-registries:
    get:
      tags:
        - Registry Credential Management
      summary: List Recognized Registries
      description: >-
        Lists all the registries that are recognized by NVCF. Only when a
        registry  is recognized by NVCF that the users can add its credential to
        their account  and then use it to create functions. Requires a bearer
        token in the HTTP Authorization header with 'manage_registries' scope. 
      operationId: getRecognizedRegistries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognizedRegistriesResponse'
  /v2/nvcf/deployments/{deploymentId}:
    get:
      tags:
        - Function Deployment
      summary: Get Function Deployment Details
      description: >-
        Allows Account Admins to retrieve the deployment details of the
        specified  deployment id. Access to this endpoint mandates a bearer
        token with 'deploy_function' scope in the  HTTP Authorization header. 
      operationId: getFunctionDeployment_1
      parameters:
        - name: deploymentId
          in: path
          description: Deployment id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
  /v2/nvcf/clusterGroups:
    get:
      tags:
        - Cluster Groups and GPUs
      summary: List Cluster Groups
      description: >-
        Lists Cluster Groups for the current account. The response includes
        cluster  groups defined specifically in the current account and publicly
        available  cluster groups such as GFN, OCI, etc. Requires a bearer token
        with 'list_cluster_groups' scope in HTTP Authorization header. 
      operationId: getClusterGroups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterGroupsResponse'
      deprecated: true
components:
  schemas:
    UpdateTelemetrySecretRequest:
      type: object
      description: Request payload to update secret
      properties:
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: Telemetry secret
      required:
        - secret
    DeploymentResponse:
      type: object
      description: Function Deployment Response
      properties:
        deployment:
          $ref: '#/components/schemas/FunctionDeploymentDto'
          description: Deployment details
      required:
        - deployment
    UpdateFunctionDeploymentRequest:
      type: object
      description: Request to update function deployment spec
      properties:
        deploymentSpecifications:
          type: array
          description: >-
            Deployment specs with GPU, instance-type, etc. details for update
            request
          items:
            $ref: '#/components/schemas/UpdateGpuSpecificationDto'
          maxItems: 2147483647
          minItems: 1
      required:
        - deploymentSpecifications
    FunctionDeploymentRequest:
      type: object
      description: Request to deploy a function
      properties:
        deploymentSpecifications:
          type: array
          description: GPU specs with GPU, instance-type, clusters etc. details
          items:
            $ref: '#/components/schemas/GpuSpecificationDto'
          maxItems: 2147483647
          minItems: 1
      required:
        - deploymentSpecifications
    FunctionResponse:
      type: object
      description: Response body with function details
      properties:
        function:
          $ref: '#/components/schemas/FunctionDto'
          description: Function details
      required:
        - function
    ListTelemetryResponse:
      type: object
      description: Response containing a list of telemetry configurations.
      properties:
        telemetries:
          type: array
          description: List of telemetry configurations.
          items:
            $ref: '#/components/schemas/TelemetryDto'
          maxItems: 2147483647
          minItems: 0
    TelemetryRequest:
      type: object
      description: Data Transfer Object (DTO) representing a telemetry request
      properties:
        endpoint:
          type: string
          format: UTF-8
          description: Telemetry endpoint URL
          maxLength: 262144
          minLength: 1
        protocol:
          type: string
          format: UTF-8
          description: Protocol used for communication
          enum:
            - HTTP
            - GRPC
          maxLength: 262144
          minLength: 0
        provider:
          type: string
          format: UTF-8
          description: Telemetry provider
          enum:
            - PROMETHEUS
            - GRAFANA_CLOUD
            - SPLUNK
            - DATADOG
            - SERVICENOW
            - KRATOS
            - KRATOS_THANOS
            - TIMESTREAM
            - VICTORIAMETRICS
            - AZURE_MONITOR
            - OTEL_COLLECTOR
          maxLength: 262144
          minLength: 0
        types:
          type: array
          description: Set of telemetry data types
          items:
            type: string
            enum:
              - LOGS
              - METRICS
              - TRACES
          maxItems: 2147483647
          minItems: 1
          uniqueItems: true
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: Single secret associated with the telemetry configuration
      required:
        - endpoint
        - protocol
        - provider
        - secret
        - types
    TelemetryResponse:
      type: object
      description: Data Transfer Object (DTO) representing a telemetry response
      properties:
        telemetry:
          $ref: '#/components/schemas/TelemetryDto'
          description: Telemetry details
    ListRegistryCredentialDetailsResponse:
      type: object
      description: Response body containing list of registry credentials
      properties:
        registryCredentials:
          type: array
          description: List of registry credentials
          items:
            $ref: '#/components/schemas/RegistryCredentialDetailsDto'
          maxItems: 2147483647
          minItems: 0
      required:
        - registryCredentials
    AddRegistryCredentialRequest:
      type: object
      description: Request body to add a registry credential to an account
      properties:
        registryHostname:
          type: string
          format: UTF-8
          description: Registry hostname
          maxLength: 255
          minLength: 1
          pattern: >-
            (?=^.{4,253}$)(^((?!-)[a-zA-Z0-9-]{1,63}(?<!-)\.)+[a-zA-Z0-9]{2,63}$)
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: >-
            Registry credential - secret value must be base64 encoded string in
            username:password format
        artifactTypes:
          type: array
          description: Artifact types that can be retrieved using this credential
          items:
            type: string
            enum:
              - CONTAINER
              - HELM
              - MODEL
              - RESOURCE
          maxItems: 2147483647
          minItems: 1
          uniqueItems: true
        tags:
          type: array
          description: Optional set of tags
          items:
            type: string
            pattern: '[a-zA-Z0-9\-_:=]+'
          maxItems: 64
          minItems: 0
          uniqueItems: true
        description:
          type: string
          format: UTF-8
          description: Optional registry credential description
          maxLength: 262144
          minLength: 0
      required:
        - artifactTypes
        - registryHostname
        - secret
    RegistryCredentialDetailsResponse:
      type: object
      description: Response body for Registry Credential operations
      properties:
        registryCredential:
          $ref: '#/components/schemas/RegistryCredentialDetailsDto'
          description: Registry credential details
      required:
        - registryCredential
    UpdateRegistryCredentialRequest:
      type: object
      description: Request body to update registry credential
      properties:
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: >-
            Registry credential - secret value must be base64 encoded string in
            username:password format
        artifactTypeEnums:
          type: array
          description: Optional artifact types to be added to the existing ones
          items:
            type: string
            enum:
              - CONTAINER
              - HELM
              - MODEL
              - RESOURCE
          maxItems: 2147483647
          minItems: 0
          uniqueItems: true
    UpdateGpuSpecificationRequest:
      type: object
      description: Request to update single function deployment GPU Specification
      properties:
        maxInstances:
          type: integer
          format: int32
          description: Maximum number of instances for the deployment
          maximum: 2147483647
          minimum: -2147483648
        minInstances:
          type: integer
          format: int32
          description: Minimum number of instances for the deployment
          maximum: 2147483647
          minimum: -2147483648
        autoscalingConfiguration:
          $ref: '#/components/schemas/AutoscalingConfigurationDto'
          description: Customizable Autoscaling configuration
        autoscalingConfigurationPolicy:
          type: string
          format: UTF-8
          description: >-
            Autoscaling configuration policy. CUSTOM_CONFIGURATION (default):
            use the provided autoscalingConfig. PLATFORM_CONFIGURATION: remove
            custom config and use platform defaults.
          enum:
            - CUSTOM_CONFIGURATION
            - PLATFORM_CONFIGURATION
          maxLength: 262144
          minLength: 0
    UpdateGpuSpecificationResponse:
      type: object
      description: Update GPU Specification Response
      properties:
        gpuSpecification:
          $ref: '#/components/schemas/GpuSpecificationDto'
          description: GPU Specification details
      required:
        - gpuSpecification
    RecognizedRegistriesResponse:
      type: object
      description: Response body for recognized registries endpoint
      properties:
        recognizedRegistries:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: string
          description: Recognized registries
    ClusterGroupsResponse:
      type: object
      properties:
        clusterGroups:
          type: array
          items:
            $ref: '#/components/schemas/ClusterGroup'
          maxItems: 2147483647
          minItems: 0
    SecretDto:
      type: object
      description: Data Transfer Object(DTO) representing secret name/value pair
      properties:
        name:
          type: string
          format: UTF-8
          description: Secret name
          maxLength: 48
          minLength: 1
          pattern: ^[a-z0-9A-Z][a-z0-9A-Z\_\.\-]*$
        value:
          $ref: '#/components/schemas/JsonNode'
          description: Secret value must be 1 - 32768 chars long
      required:
        - name
    FunctionDeploymentDto:
      type: object
      description: Function deployment response
      properties:
        functionId:
          type: string
          format: uuid
          description: Function id
          maxLength: 36
          minLength: 36
        functionVersionId:
          type: string
          format: uuid
          description: Function version id
          maxLength: 36
          minLength: 36
        deploymentId:
          type: string
          format: uuid
          description: Last deployment id
          maxLength: 36
          minLength: 36
        functionName:
          type: string
          format: UTF-8
          description: Function name
          maxLength: 262144
          minLength: 1
        ncaId:
          type: string
          format: UTF-8
          description: NVIDIA Cloud Account Id
          maxLength: 262144
          minLength: 1
        functionStatus:
          type: string
          format: UTF-8
          description: Function status
          enum:
            - ACTIVE
            - DEPLOYING
            - ERROR
            - INACTIVE
            - DELETED
            - DEGRADED
            - DEGRADING
          maxLength: 262144
          minLength: 0
        healthInfo:
          type: array
          description: >
            Health info for a deployment specification is included only if there
            are any
             issues/errors.
          items:
            $ref: '#/components/schemas/DeploymentHealthDto'
          maxItems: 2147483647
          minItems: 0
        deploymentSpecifications:
          type: array
          description: Function deployment details
          items:
            $ref: '#/components/schemas/GpuSpecificationDto'
          maxItems: 2147483647
          minItems: 0
        createdAt:
          type: string
          format: date-time
          description: Function deployment creation timestamp
          maxLength: 30
          minLength: 8
        lastUpdatedAt:
          type: string
          format: date-time
          description: Function deployment modification timestamp
          maxLength: 30
          minLength: 8
      required:
        - createdAt
        - deploymentId
        - deploymentSpecifications
        - functionId
        - functionName
        - functionStatus
        - functionVersionId
        - lastUpdatedAt
        - ncaId
    UpdateGpuSpecificationDto:
      type: object
      description: >-
        Data Transfer Object (DTO) representing GPU specification for Deployment
        Update case.
      properties:
        gpuSpecificationId:
          type: string
          format: uuid
          description: GPU specification id
          maxLength: 36
          minLength: 36
        gpu:
          type: string
          format: UTF-8
          description: >-
            GPU name from the cluster. Deprecated: this is read-only field,
            should not be specified in update request.
          maxLength: 262144
