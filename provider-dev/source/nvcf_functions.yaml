openapi: 3.1.0
info:
  title: nvcf_functions API
  description: nvidia nvcf_functions API
  version: 2.245.1
paths:
  /v2/nvcf/secrets/functions/{functionId}/versions/{versionId}:
    put:
      tags:
        - User Secret Management
      summary: Update user secrets for a function version
      description: >-
        Updates secrets for the specified function version. This endpoint 
        requires a bearer token with 'update_secrets' scope in the HTTP 
        Authorization header. 
      operationId: updateFunctionSecrets
      parameters:
        - name: functionId
          in: path
          description: Function Id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: versionId
          in: path
          description: Function Version Id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionSecretsRequest'
        required: true
      responses:
        '204':
          description: No Content
  /v2/nvcf/ratelimit/functions/{functionId}/versions/{versionId}:
    put:
      tags:
        - User Ratelimit Management
      summary: Update user ratelimit for a function version
      description: >-
        Deprecated: use PUT
        /v2/nvcf/functions/{functionId}/versions/{versionId}  to update
        ratelimit and other mutable function fields. This legacy endpoint  only
        updates ratelimit for the specified function version and requires a 
        bearer token with 'update_function' scope in the HTTP Authorization
        header. 
      operationId: updateRateLimit
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: versionId
          in: path
          description: Function version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionRequest'
        required: true
      responses:
        '204':
          description: No Content
      deprecated: true
    delete:
      tags:
        - User Ratelimit Management
      summary: Delete user ratelimit for a function version
      description: >-
        Delete ratelimit for the specified function version. This endpoint 
        requires a bearer token with 'update_function' scope in the HTTP 
        Authorization header. 
      operationId: deleteRateLimit
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: versionId
          in: path
          description: Function version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '204':
          description: No Content
  /v2/nvcf/metadata/functions/{functionId}/versions/{functionVersionId}:
    put:
      tags:
        - Function Management
      summary: Update Function Metadata
      description: >-
        Deprecated: use PUT
        /v2/nvcf/functions/{functionId}/versions/{functionVersionId} to update
        tags, rate limit, model-specific LLM config, and other mutable function
        fields. This legacy endpoint updates the same mutable function version
        fields for the authenticated NVIDIA Cloud Account and requires a bearer
        token with 'update_function' scope in the HTTP Authorization header. 
      operationId: updateFunctionMetadata
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
      deprecated: true
  /v2/nvcf/functions/{functionId}/versions/{functionVersionId}:
    get:
      tags:
        - Function Management
      summary: Get Function Version Details
      description: >-
        Retrieves detailed information of the specified function version in the 
        authenticated NVIDIA Cloud Account. Requires a bearer token with 
        'list_functions' or 'list_functions_details' scopes in the HTTP 
        Authorization header. 
      operationId: getFunction
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: 'Version id '
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: includeSecrets
          in: query
          description: >
            Query param 'includeSecrets' indicates whether to include secret
            names
             for the function in the response.
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
    put:
      tags:
        - Function Management
      summary: Updates mutable fields of the specified function version.
      description: >-
        Updates mutable fields of the specified function version within the
        authenticated NVIDIA Cloud Account. The current request payload supports
        tags updates, rate limit updates, and model-specific LLM config updates.
        Requires a bearer token with 'update_function' scope in the HTTP
        Authorization header. 
      operationId: updateFunction
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
    delete:
      tags:
        - Function Management
      summary: Delete Function
      description: >-
        Deletes the specified function version in the authenticated NVIDIA
        Cloud  Account. Requires a bearer token with 'delete_function' scope in
        the HTTP  Authorization header. If the function version is public, then
        Account Admin  cannot delete the function. 
      operationId: deleteFunction
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '204':
          description: No Content
  /v2/nvcf/functions:
    get:
      tags:
        - Function Management
      summary: List Functions
      description: >-
        Lists all the functions associated with the authenticated NVIDIA Cloud
        Account.  Requires a bearer token  with 'list_functions' or
        'list_functions_details'  scope in the HTTP Authorization header.
      operationId: getFunctions
      parameters:
        - name: visibility
          in: query
          description: >
            Query param 'visibility' indicates the kind of functions to be
            included
             in the response.
          required: false
          schema:
            type: array
            default:
              - authorized
              - private
              - public
            items:
              type: string
              format: UTF-8
              enum:
                - authorized
                - private
                - public
              maxLength: 262144
              minLength: 0
            maxItems: 2147483647
            minItems: 0
            uniqueItems: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionsResponse'
    post:
      tags:
        - Function Management
      summary: Create Function
      description: >-
        Creates a new function within the authenticated NVIDIA Cloud Account.
        Requires a  bearer token with 'register_function' scope in the HTTP
        Authorization header. 
      operationId: createFunction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFunctionResponse'
  /v2/nvcf/functions/{functionId}/versions:
    get:
      tags:
        - Function Management
      summary: List Function Versions
      description: >-
        Lists details of all the versions of the specified function in the
        authenticated  NVIDIA Cloud Account. Requires a bearer token  with
        'list_functions' or  'list_functions_details' scopes in the HTTP
        Authorization header. 
      operationId: getFunctions_1
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionsResponse'
    post:
      tags:
        - Function Management
      summary: Create Function Version
      description: >-
        Creates a version of the specified function within the authenticated
        NVIDIA  Cloud Account. If the function is public, then Account Admin
        cannot create  a version. Requires a bearer token with
        'register_function' scope in the  HTTP Authorization header. 
      operationId: createFunction_1
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFunctionResponse'
  /v2/nvcf/authorizations/functions/{functionId}:
    get:
      tags:
        - Function Sharing
      summary: List Account Authorizations For Function
      description: >-
        Lists NVIDIA Cloud Account IDs that are authorized to invoke any version
        of the  specified function. The response includes an array showing
        authorized accounts  for each version. Individual versions of a function
        can have their own  authorized accounts. So, each object in the array
        can have different  authorized accounts listed. Access to this
        functionality mandates the inclusion of a bearer token with the 
        'authorize_clients' scope in the HTTP Authorization header 
      operationId: getAuthorizedPartiesForAllVersions
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuthorizedPartiesResponse'
    post:
      tags:
        - Function Sharing
      summary: Authorize Accounts To Invoke Function
      description: >-
        Authorizes additional NVIDIA Cloud Accounts to invoke any version of
        the  specified function. By default, a function belongs to the NVIDIA
        Cloud Account  that created it, and the credentials used for function
        invocation must  reference the same NVIDIA Cloud Account. Upon
        invocation of this endpoint, any  existing authorized accounts will be
        overwritten by the newly specified  authorized accounts. Access to this
        functionality mandates the inclusion of a bearer token with the 
        'authorize_clients' scope in the HTTP Authorization header 
      operationId: createAuthorizedPartiesForAllVersions
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedPartiesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
    delete:
      tags:
        - Function Sharing
      summary: Delete All Authorizations At Function Level
      description: >-
        Deletes authorizations at the function level. This impacts all versions
        of  the function. If a function versions has its own set of
        authorizations,  those are not deleted. If the specified function is
        public, then  Account Admin cannot perform this operation. Note that the
        response does  not include any authz accounts at version level. Access
        to this functionality mandates the inclusion of a bearer token with the 
        'authorize_clients' scope in the HTTP Authorization header 
      operationId: deleteAuthorizedPartiesForAllVersions
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
  /v2/nvcf/authorizations/functions/{functionId}/versions/{functionVersionId}:
    get:
      tags:
        - Function Sharing
      summary: Get Account Authorizations For Function Version
      description: >-
        Gets NVIDIA Cloud Account IDs that are authorized to invoke specified
        function  version. Response includes authorized accounts that were added
        specifically  at the version level and the authorized accounts that were
        inherited from  function level. Access to this functionality mandates
        the inclusion of a bearer token with the  'authorize_clients' scope in
        the HTTP Authorization header 
      operationId: getAuthorizedPartiesForSpecificVersion
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
    post:
      tags:
        - Function Sharing
      summary: Authorize Accounts To Invoke/List Function Version
      description: >-
        Authorizes additional NVIDIA Cloud Accounts to invoke a specific
        function  version. By default, a function belongs to the NVIDIA Cloud
        Account that  created it, and the credentials used for function
        invocation must reference  the same NVIDIA Cloud Account. Upon
        invocation of this endpoint, any existing  authorized accounts will be
        overwritten by the newly specified authorized  accounts. Note that the
        response does NOT include inherited authorized accounts  that were added
        at the function level. Access to this functionality mandates the
        inclusion of a bearer token with the  'authorize_clients' scope in the
        HTTP Authorization header 
      operationId: createAuthorizedPartiesForSpecificVersion
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedPartiesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
    delete:
      tags:
        - Function Sharing
      summary: Delete All Authorizations At Version Level
      description: >-
        Deletes all the authorized accounts that are directly associated with
        the  specified function version. Authorized parties that are inherited
        by the  function version are not deleted. If the specified function
        version is public,  then Account Admin cannot perform this operation.
        Note that the response  does not include inherited authorized accounts
        that were added at the function  level. Access to this functionality
        mandates the inclusion of a bearer token with the  'authorize_clients'
        scope in the HTTP Authorization header 
      operationId: deleteAuthorizedPartiesForSpecificVersion
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
  /v2/nvcf/authorizations/functions/{functionId}/versions/{functionVersionId}/remove:
    patch:
      tags:
        - Function Sharing
      summary: >-
        Unauthorize Account From Invoking, Listing, and Checking Queue Details
        of Function Version
      description: >-
        Removes the specified NVIDIA Cloud Account from the set of authorized
        accounts  that are directly associated with specified function version.
        If the specified  function version does not have any of its own(not
        inherited) authorized  accounts, it results in a response with status
        404. Also, if the specified  authorized account is not in the set of
        existing authorized parties that are  directly associated with the
        specified function version, it results in a  response with status code
        404. If the specified function version is public,  then Account Admin
        cannot perform this operation. Note that the response  does not include
        inherited authorized accounts that were added at the function  level.
        Access to this functionality mandates the inclusion of a bearer token
        with the  'authorize_clients' scope in the HTTP Authorization header 
      operationId: removeAuthorizedPartyForSpecificVersion
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
  /v2/nvcf/authorizations/functions/{functionId}/versions/{functionVersionId}/add:
    patch:
      tags:
        - Function Sharing
      summary: >-
        Authorize Another Account To Invoke, List, and Check Queue Details of
        Function Version
      description: >-
        Adds the specified NVIDIA Cloud Account to the set of authorized
        accounts that  can invoke the specified function version. If the
        specified function version  does not have any existing inheritable
        authorized accounts, it results in a  response with status 404. If the
        specified account is already in the set of  existing authorized accounts
        that are directly associated with the function  version, it results in a
        response wit status code 409. If a function is public,  then Account
        Admin cannot perform this operation. Note that the response  does not
        include inherited authorized accounts that were added at the function 
        level. Access to this functionality mandates the inclusion of a bearer
        token with the  'authorize_clients' scope in the HTTP Authorization
        header 
      operationId: addAuthorizedPartyForSpecificVersion
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
        - name: functionVersionId
          in: path
          description: Function version
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
  /v2/nvcf/authorizations/functions/{functionId}/remove:
    patch:
      tags:
        - Function Sharing
      summary: >-
        Unauthorize Account From Invoking, Listing, and Checking Queue Details
        of Function
      description: >-
        Removes the specified NVIDIA Cloud Account from the set of authorized
        accounts  that can invoke all the versions of the specified function. If
        the specified  function does not have any existing inheritable
        authorized parties, it results  in a response with status 404. Also, if
        the specified account is not in the  existing set of inheritable
        authorized accounts, it results in a response with  status 404. If the
        specified function is public, then Account Admin cannot  perform this
        operation. Note that response only includes the remaining  authorized
        accounts at the function level. Access to this functionality mandates
        the inclusion of a bearer token with the  'authorize_clients' scope in
        the HTTP Authorization header 
      operationId: removeAuthorizedPartyForAllVersions
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
  /v2/nvcf/authorizations/functions/{functionId}/add:
    patch:
      tags:
        - Function Sharing
      summary: >-
        Authorize Another Account To Invoke, List, and Check Queue Details of
        Function
      description: >-
        Adds the specified NVIDIA Cloud Account to the set of authorized
        accounts that  are can invoke all the versions of the specified
        function. If the specified  function does not have any existing
        inheritable authorized accounts, it results  in a response with status
        404. If the specified account is already in the set  of existing
        inheritable authorized accounts, it results in a response with  status
        code 409. If a function is public, then Account Admin cannot perform 
        this operation. Note that response only includes authz accounts at the 
        function level. Access to this functionality mandates the inclusion of a
        bearer token with the  'authorize_clients' scope in the HTTP
        Authorization header 
      operationId: addAuthorizedPartyForAllVersions
      parameters:
        - name: functionId
          in: path
          description: Function id
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            minLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
  /v2/nvcf/functions/ids:
    get:
      tags:
        - Function Management
      summary: List Function Ids
      description: >-
        Lists ids of all the functions in the authenticated NVIDIA Cloud
        Account.  Requires a bearer token with 'list_functions' or
        'list_functions_details'  scopes in the HTTP Authorization header. 
      operationId: getFunctionIds
      parameters:
        - name: visibility
          in: query
          description: >
            Query param 'visibility' indicates the kind of functions to be
            included
             in the response.
          required: false
          schema:
            type: array
            default:
              - authorized
              - private
              - public
            items:
              type: string
              format: UTF-8
              enum:
                - authorized
                - private
                - public
              maxLength: 262144
              minLength: 0
            maxItems: 2147483647
            minItems: 0
            uniqueItems: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionIdsResponse'
components:
  schemas:
    UpdateFunctionSecretsRequest:
      type: object
      description: Request payload to update secrets
      properties:
        secrets:
          type: array
          description: Secrets
          items:
            $ref: '#/components/schemas/SecretDto'
          maxItems: 2147483647
          minItems: 0
          uniqueItems: true
      required:
        - secrets
    UpdateFunctionRequest:
      type: object
      description: Request payload to update mutable function configuration fields.
      properties:
        tags:
          type: array
          description: >-
            Optional set of function tags. When omitted, the existing value is
            preserved.
          items:
            type: string
            pattern: '[a-zA-Z0-9\-_:=]+'
          maxItems: 64
          minItems: 0
          uniqueItems: true
        rateLimit:
          $ref: '#/components/schemas/RateLimitDto'
          description: >-
            Optional full replacement for the function rate limit configuration.
            When omitted, the existing value is preserved. Use the delete
            rate-limit endpoint to clear it.
        modelUpdates:
          type: array
          description: Optional list of model-specific updates.
          items:
            $ref: '#/components/schemas/ModelUpdateDto'
          maxItems: 2147483647
          minItems: 0
    FunctionResponse:
      type: object
      description: Response body with function details
      properties:
        function:
          $ref: '#/components/schemas/FunctionDto'
          description: Function details
      required:
        - function
    ListFunctionsResponse:
      type: object
      description: Response body containing list of functions
      properties:
        functions:
          type: array
          description: List of functions
          items:
            $ref: '#/components/schemas/FunctionDto'
          maxItems: 2147483647
          minItems: 0
      required:
        - functions
    CreateFunctionRequest:
      type: object
      description: Request payload to create function.
      properties:
        name:
          type: string
          format: UTF-8
          description: >-
            Function name must start with lowercase/uppercase/digit and can only
            contain lowercase, uppercase, digit, hyphen, and underscore
