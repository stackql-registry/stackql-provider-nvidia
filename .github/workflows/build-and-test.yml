name: build-and-test

# Build the nvidia provider from the committed spec pins and run every
# credential-free test layer on each push / PR; the live smoke suite runs
# only where the NGC secrets are configured (never the NVCF deploy
# lifecycle - that is `make smoke-nvcf`, run deliberately); a scheduled
# drift job re-downloads the upstream inputs (the NVCF spec, the NGC API
# explorer definitions, the ngcsdk wheel) and diffs them against the pins,
# and checks the NGC deprecation schedule page for changes.

on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['website/**']
  pull_request:
    branches: [main]
    paths-ignore: ['website/**']
  schedule:
    - cron: '17 3 * * 1'   # weekly upstream drift check (Monday 03:17 UTC)
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # puts the latest stackql on PATH; bin/start-server.sh and the test
      # runners resolve it from there
      - name: Install stackql
        uses: stackql/setup-stackql@v2

      - name: stackql version
        run: stackql --version

      - name: Build provider from the committed pins (pin check, clean, inventory, split, mappings, normalize, generate, post-process)
        run: make build

      - name: Fail on uncommitted generation drift
        run: |
          git add -N .
          if ! git diff --quiet -- provider-dev/openapi provider-dev/config provider-dev/source; then
            echo "Generated output differs from the committed artifacts - run 'make build' and commit (a diff in provider-dev/config/all_services.csv is a mapping change: review it as a breaking-change candidate)."
            git diff --stat -- provider-dev/openapi provider-dev/config provider-dev/source
            exit 1
          fi

      - name: Offline validation
        run: make test-offline

      - name: Integration tests (mock NGC + NVCF)
        run: make test-integration

      - name: Meta-route tests
        run: make test-meta

      - name: Generate docs (sanity - the site build runs on the web workflows)
        run: make docs

  smoke:
    # secret-gated live smoke suite against a test organization; skipped
    # with a notice when the secrets are not configured (forks, PRs from
    # outside). The NVCF deploy lifecycle is NOT run here - trigger it
    # deliberately with `make smoke-nvcf`.
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      NGC_ORG: ${{ secrets.NGC_ORG }}
      NGC_TEAM: ${{ secrets.NGC_TEAM }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Live smoke suite (catalog + org/registry reads, cheap write lifecycles, NVCF reads where enabled)
        if: env.NGC_API_KEY != ''
        run: make smoke

      - name: Live smoke skipped (no credentials)
        if: env.NGC_API_KEY == ''
        run: |
          echo "::notice title=Live smoke suite skipped::NGC_API_KEY / NGC_ORG secrets are not configured - the live smoke suite did not run. Credential-free coverage still ran via the mock-server integration suite."

  upstream-drift:
    # Re-download every upstream input and diff against the pins on a
    # schedule and on demand; check the NGC deprecation schedule page for
    # changes; open an issue when anything moves. NVIDIA serves unversioned
    # definitions, so drift is expected and must be reviewed, never silent.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch upstream inputs and compare against the pins
        id: drift
        run: |
          set +e
          make fetch-specs > fetch.log 2>&1
          rc=$?
          set -e
          cat fetch.log
          if [ "$rc" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- provider-dev/downloaded > drift.txt || true
            cat drift.txt
          fi

      - name: Check the NGC deprecation schedule page
        id: deprecation
        run: |
          node provider-dev/scripts/check_deprecation_page.mjs > deprecation.log 2>&1 || echo "changed=true" >> "$GITHUB_OUTPUT"
          cat deprecation.log

      - name: Report drift
        if: steps.drift.outputs.drift == 'true' || steps.deprecation.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const stat = fs.existsSync('drift.txt') ? fs.readFileSync('drift.txt', 'utf8') : '';
            const dep = fs.existsSync('deprecation.log') ? fs.readFileSync('deprecation.log', 'utf8') : '';
            const title = 'NVIDIA NGC / NVCF upstream drift detected';
            const body = 'One or more upstream inputs no longer match the pins in provider-dev/config/spec_pin.json, or the NGC deprecation schedule page changed.\n\nSpec drift:\n```\n' + (stat || '(none)') + '\n```\nDeprecation page:\n```\n' + dep + '\n```\nRun `make upgrade` (refresh-specs, build, test, docs, website), review the generated diff - new or removed operations, mapping changes in all_services.csv, new deprecation families in build_inventory.mjs - update NOTES.md, and commit.';
            await core.summary.addHeading(title).addCodeBlock(stat + '\n' + dep).write();
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-drift'
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-drift']
            });
