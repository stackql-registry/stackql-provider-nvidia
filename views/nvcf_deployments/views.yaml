# Views spliced into the generated nvcf_deployments service at generate time
# (provider-utils reads ./views/<service>/views.yaml). See ../README.md.

vw_gpu_capacity:
  name: vw_gpu_capacity
  id: nvidia.nvcf_deployments.vw_gpu_capacity
  title: GPU Capacity
  config:
    docs:
      description: >-
        The GPU estate the organization can deploy NVIDIA Cloud Functions to,
        one row per cluster group x GPU type x instance type, flattened from
        the cluster_groups resource (clusterGroups[].gpus[].instanceTypes[]).
      fields:
      - {name: cluster_group, type: string, description: Cluster group name (the backend named in a deployment specification).}
      - {name: cluster_group_id, type: string, description: Cluster group id.}
      - {name: gpu, type: string, description: GPU type available in the cluster group (for example L40, H100).}
      - {name: instance_type, type: string, description: Instance type name for the GPU (the instanceType of a deployment specification).}
      - {name: instance_description, type: string, description: Vendor description of the instance type.}
      - {name: is_default, type: boolean, description: Whether the instance type is the default for the GPU.}
      - {name: cluster, type: string, description: Name of the first cluster in the group.}
      - {name: nca_id, type: string, description: NVIDIA Cloud Account that owns the cluster group.}
    views:
      select:
        predicate: sqlDialect == "sqlite3"
        ddl: |-
          SELECT cg.name AS cluster_group,
                 cg.id AS cluster_group_id,
                 json_extract(g.value, '$.name') AS gpu,
                 json_extract(it.value, '$.name') AS instance_type,
                 json_extract(it.value, '$.description') AS instance_description,
                 json_extract(it.value, '$.default') AS is_default,
                 json_extract(cg.clusters, '$[0].name') AS cluster,
                 cg.nca_id
          FROM nvidia.nvcf_deployments.cluster_groups cg,
               json_each(cg.gpus) g,
               json_each(json_extract(g.value, '$.instanceTypes')) it
        fallback:
          predicate: sqlDialect == "postgres"
          ddl: |-
            SELECT cg.name AS cluster_group,
                   cg.id AS cluster_group_id,
                   g.value->>'name' AS gpu,
                   it.value->>'name' AS instance_type,
                   it.value->>'description' AS instance_description,
                   (it.value->>'default')::boolean AS is_default,
                   cg.clusters::jsonb->0->>'name' AS cluster,
                   cg.nca_id
            FROM nvidia.nvcf_deployments.cluster_groups cg,
                 jsonb_array_elements(cg.gpus::jsonb) AS g(value),
                 jsonb_array_elements(g.value->'instanceTypes') AS it(value)
